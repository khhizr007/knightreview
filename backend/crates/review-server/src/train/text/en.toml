prepare_castle_kingside = "Clear the way so your king can castle."
prepare_castle_queenside = "Clear the way so your king can castle long."
castle_kingside = "Your king is safer once it has castled."
castle_queenside = "Castling long brings the king to safety and a rook to the centre."
castle_same_side = "Tuck your king away: castle."
castle_opposite_side = "Castle on the other side, then your pawns can attack."
pawn_to_center = "Put a pawn on a central square."
gain_tempo = "Develop with a threat, so your opponent has to answer it."
connect_rooks = "Clear the back rank so your rooks can see each other."
doubles_pawns = "Keep your pawns healthy: doubled pawns are hard to defend."
isolates_pawn = "A pawn with no neighbours is a target. Keep your pawns together."
backward_pawn = "A pawn left behind on a half-open file becomes a target."
pawn_in_front_of_king = "The pawns in front of your castled king are its shield. Leave them be."
