brilliant = "Giving up material can be the strongest move. Look at what it opens up."
mate = "Look at the king. Checks first: is there a forced mate?"
queen_out_early = "The queen is strong, but it can be chased. Bring out a knight or bishop first."
same_piece_twice = "Pieces still at home want to come out before one piece moves again."
loses_castling = "Keep the right to castle: the king wants to get to safety."
plays_f3 = "The f-pawn guards the king's diagonal. Leave it at home for now."
develop = "Bring a new piece into the game."
develop_to_center = "A knight or bishop wants a square near the centre."
prepare_bishop = "One of your bishops is shut in. Open a way for it."
bishop_scope = "Give a bishop a longer diagonal."
