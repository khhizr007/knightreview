# English trainer text. Every word in this file was written for this project.
#
# Goals are said before the drill's move: they set the task and never name the move, the piece
# or the square. Hints are the second hint: the idea in one sentence. Replies are said after the
# move, by grade. A list holds wordings; one is picked per drill.

# ---------------------------------------------------------------- goals, by kind

[goal]
opening = [
  "You're still in the opening. Which move helps your position most?",
  "Opening time. Find the move that gets your game going.",
]
strategy = [
  "Find the move that improves your position.",
  "Think about your pieces and pawns. What does the position ask for?",
]
miss = [
  "Your opponent just went wrong. Find the move that makes them pay.",
  "There's a chance here. Can you find it?",
]
miss_brilliant = [
  "Your opponent just went wrong, and a bold move takes advantage of it. Find it.",
]
miss_free_pieces = [
  "Something is left loose on the board. Find it.",
  "Look around the board: can you win material right away?",
]
blunder = [
  "You're doing well here. Find a move that keeps it that way.",
  "Before you move, check what your opponent can do next.",
]
blunder_mate = [
  "Careful: your king is in more danger than it looks. Find a safe move.",
]

# Endgame technique drills, by family.
endgame_king_and_pawn = [
  "King and pawn ending. Every king move counts: find the right one.",
]
endgame_rook_and_pawn = [
  "Rook ending. Find the move that keeps your result.",
]
endgame_queen = [
  "Queen ending. Find the move that keeps your result.",
]
endgame_other = [
  "Endgame. Find the move that keeps your result.",
]

