attack_pawn_chain = "Hit the pawn chain at its base."
make_passed_pawn = "Can you make a pawn that nothing can stop?"
push_passed_pawn = "Passed pawns must be pushed."
create_luft = "Give your king a little air before a back-rank mate becomes a threat."
endgame_king_and_pawn = "In pawn endings the king is a strong piece. Think about the opposition."
endgame_rook_and_pawn = "Keep your rook active; rooks belong behind passed pawns."
endgame_queen = "Watch out for checks and keep your queen close to the action."
endgame_other = "Activate your king and use every piece."

# The endgame idea found on the best line, when there is one (said instead of the family hint).
[concept]
opposition = "Look for the king move that takes the opposition."
king_activity = "Bring your king into the game."
passed_pawn_push = "A passed pawn wants to move on."
rook_behind_passer = "Put your rook behind the passed pawn."
blockade = "Stop the passed pawn by standing right in front of it."
trade_into_pawn_ending = "A trade can leave a pawn ending you win. Count it out."
mating_technique = "Drive the king to the edge, step by step."
promotion = "There is a pawn that can become a queen."

# ---------------------------------------------------------------- replies, by grade

[reply]
correct = ["That's it.", "Well found.", "Exactly right."]
not_incorrect = [
  "That's playable, but there was a stronger idea here.",
  "Not bad, but there was more in the position.",
]
incorrect = [
  "That doesn't work. Here is why.",
  "Not this time. See what happens.",
]
same_as_game = ["That's the move you played in the game."]
fallback = "The engine was not available, so only the exact best move counts."

